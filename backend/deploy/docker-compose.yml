# Orquestación local: frontend estático (nginx) + API.
# Ejecutar desde la raíz del repo:
#   docker compose -f backend/deploy/docker-compose.yml up --build
services:
  frontend:
    build:
      context: ../..
      dockerfile: backend/deploy/Dockerfile.frontend
    ports:
      - "8080:80"

