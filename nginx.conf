# Config de nginx para servir la SPA (copiado por el dockerfile de la raíz).
# Nota: add_header NO se hereda en un location que defina sus propios headers.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  # SPA fallback: todas las rutas caen en index.html (React Router)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
